<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #0f0f0f;
  color: white;
  font-family: sans-serif;
  padding: 15px;
}

.card {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #2aabee;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  margin: 5px;
  cursor: pointer;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  margin-bottom: 8px;
}

#friendsList {
  margin-top: 10px;
}

.friend {
  background: #292929;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 6px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Invite & Earn</h2>

  <p>Your Link:</p>

  <input
    id="refLink"
    readonly
    value="https://t.me/your_bot?start=123456"
  >

  <button onclick="copyLink()">📋 Copy</button>
  <button onclick="shareTG()">📤 Share</button>
</div>

<div class="card stats">
  <div>Total: <span id="totalFriends">0</span></div>
  <div>Earned: <span id="bonusEarned">0 ZYN</span></div>

  <button onclick="claimBonus()">Claim Bonus</button>
</div>

<div class="card" id="friendsList">
  Loading...
</div>

<script>
let userId =
  window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "123456";

let documentGetElementById =
  id => document.getElementById(id);

let refLink =
  documentGetElementById("refLink");

refLink.value =
  "https://t.me/your_bot?start=" + userId;


// Copy Link
function copyLink() {
  navigator.clipboard.writeText(refLink.value)
    .then(() => {
      alert("✅ Link Copied!");
    })
    .catch(() => {
      refLink.select();
      document.execCommand("copy");
      alert("✅ Link Copied!");
    });
}


// Telegram Share
function shareTG() {
  let url =
    "https://t.me/share/url?url=" +
    encodeURIComponent(refLink.value) +
    "&text=" +
    encodeURIComponent("Join Zyntra using my invite link!");

  window.open(url, "_blank");
}


// Claim Bonus
function claimBonus() {
  alert("🎁 Bonus claimed!");
}


// Friends List
let friends =
  JSON.parse(localStorage.getItem("zyntra_friends") || "[]");

documentGetElementById("totalFriends").innerText =
  friends.length;

if (friends.length > 0) {

  documentGetElementById("friendsList").innerHTML =
    friends.map(friend => `
      <div class="friend">
        👤 ${friend}
      </div>
    `).join("");

} else {

  documentGetElementById("friendsList").innerHTML =
    "No friends yet - Invite now!";

}
</script>

</body>
</html>
