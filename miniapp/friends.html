<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #0f0f0f;
  color: white;
  font-family: sans-serif;
  padding: 15px;
}

.card {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.link-box {
  display: flex;
  gap: 8px;
  align-items: center;
}

input {
  flex: 1;
  box-sizing: border-box;
  padding: 10px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  min-width: 0;
}

button {
  background: #2aabee;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
}

.copy-btn {
  white-space: nowrap;
}

.share-btn {
  margin-top: 10px;
  background: #229ed9;
}

.claim-btn {
  margin-top: 10px;
  background: #28a745;
}

.friend {
  background: #292929;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 6px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Invite & Earn</h2>

  <p>Your Link:</p>

  <div class="link-box">
    <input id="refLink" readonly>

    <button id="copyBtn" class="copy-btn" onclick="copyLink()">
      Copy
    </button>
  </div>

  <button class="share-btn" onclick="shareTG()">
    Share
  </button>
</div>


<div class="card">
  <div>
    Total:
    <span id="totalFriends">0</span>
  </div>

  <div>
    Earned:
    <span id="bonusEarned">0 ZYN</span>
  </div>

  <button class="claim-btn" onclick="claimBonus()">
    Claim Bonus
  </button>
</div>


<div class="card" id="friendsList">
  Loading...
</div>


<script>

let userId =
  window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "123456";

let refLink =
  document.getElementById("refLink");

refLink.value =
  "https://t.me/zyntra_bot?start=" + userId;


// COPY BUTTON
function copyLink() {

  let link = refLink.value;
  let copyBtn = document.getElementById("copyBtn");

  navigator.clipboard.writeText(link)
    .then(function() {

      copyBtn.innerText = "Copied ✓";

      setTimeout(function() {
        copyBtn.innerText = "Copy";
      }, 2000);

    })
    .catch(function() {

      refLink.select();
      refLink.setSelectionRange(0, 99999);

      document.execCommand("copy");

      copyBtn.innerText = "Copied ✓";

      setTimeout(function() {
        copyBtn.innerText = "Copy";
      }, 2000);

    });
}


// TELEGRAM SHARE
function shareTG() {

  let url =
    "https://t.me/share/url?url=" +
    encodeURIComponent(refLink.value) +
    "&text=" +
    encodeURIComponent(
      "Join Zyntra using my invite link!"
    );

  window.open(url, "_blank");
}


// CLAIM BONUS
function claimBonus() {

  alert("Bonus claimed!");
}


// FRIENDS LIST
let friends =
  JSON.parse(
    localStorage.getItem("zyntra_friends") || "[]"
  );

document.getElementById("totalFriends").innerText =
  friends.length;


if (friends.length > 0) {

  document.getElementById("friendsList").innerHTML =
    friends.map(function(friend) {

      return `
        <div class="friend">
          👤 ${friend}
        </div>
      `;

    }).join("");

} else {

  document.getElementById("friendsList").innerHTML =
    "No friends yet - Invite now!";

}

</script>

</body>
</html>
