<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyntra</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;background:#08081a;color:#fff;font-family:Inter,sans-serif;padding:15px;padding-bottom:80px}
  .top{background:#191932;border-radius:18px;padding:16px;text-align:center;border:1px solid #2a2a4a}
  .balance{font-size:28px;font-weight:800}
  .sub{opacity:0.7;font-size:14px;margin-top:5px}
  .main-circle{width:190px;height:190px;margin:25px auto;background:radial-gradient(circle at 30% 30%,#6c6cff,#3a3aff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 40px #3a3aff88}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .card{background:#1e1e3e;border:1px solid #2e2e5a;border-radius:16px;padding:16px;text-align:left;line-height:1.4}
  .card b{display:block;margin-top:6px}
  .card.friends{border-color:#2aabee;cursor:pointer;background:#1e2a4a}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#12122a;border-top:1px solid #2a2a4a;display:flex;justify-content:space-around;padding:12px 0}
  .nav a{color:#888;text-decoration:none;font-size:13px;text-align:center}
  .nav a.active{color:#fff}
</style>
</head>
<body>

<div class="top">
  <div class="balance">🟡 <span id="bal">1,400</span> ZYN</div>
  <div class="sub">⚡ <span id="energy">482</span>/500 • 🎯 151 • 👥 10% bonus</div>
</div>

<div class="main-circle">⚡</div>

<div class="grid">
  <div class="card"><span>🎁</span><b>Daily Bonus</b> +50 ZYN</div>
  <div class="card"><span>🌱</span><b>Farming</b> <span id="farm">166m left</span></div>
  <div class="card"><span>🎯</span><b>Missions</b> 4 Tasks +400 ZYN</div>
  <div class="card friends" onclick="window.location.href='/friends.html'"><span>👥</span><b>Friends</b> 10% bonus<br><small style="color:#2aabee">Invite & Earn →</small></div>
  <div class="card"><span>🎰</span><b>Lucky Spin</b> 2 left today</div>
  <div class="card"><span>🚀</span><b>Boost</b> Coming soon</div>
</div>

<div class="nav">
  <a>💱<br>Exchange</a>
  <a class="active">⛏️<br>Mine</a>
  <a href="/friends.html" class="active" style="color:#2aabee">👥<br>Friends</a>
  <a>💰<br>Earn</a>
  <a>👛<br>Wallet</a>
</div>

<script>
  // Telegram ID
  let tg = window.Telegram?.WebApp;
  let userId = tg?.initDataUnsafe?.user?.id || '123456';
  console.log("UserID:", userId);
  
  // Simple farming timer demo
  let mins = 166;
  setInterval(()=>{
    if(mins>0){ mins--; document.getElementById('farm').innerText = mins + 'm left'; }
  }, 60000);
</script>

</body>
</html>
