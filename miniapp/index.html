<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zyntra Bot - Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#070A14;color:#fff;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px}
.logo{font-weight:800;letter-spacing:1px}
.badge{background:#1A1E32;border:1px solid #1E293B;padding:6px 12px;border-radius:20px;font-size:12px}
.balance-card{margin:12px 16px;background:linear-gradient(180deg,#12182C,#0E1324);border:1px solid #1E293B;border-radius:24px;padding:20px}
.tap-wrap{display:flex;flex-direction:column;align-items:center;margin-top:12px}
.tap-btn{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#6366F1,#1E1B4B);border:8px solid #171D36;box-shadow:0 0 0 12px rgba(79,70,229,0.08),0 20px 60px rgba(79,70,229,0.4);font-size:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.tap-btn:active{transform:scale(0.95)}
.energy-bar{margin-top:18px;width:86%;background:#141A2E;height:12px;border-radius:20px;overflow:hidden;border:1px solid #1E293B}
.energy-fill{height:100%;background:linear-gradient(90deg,#22C55E,#86EFAC);width:100%;transition:0.3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#12182C;border:1px solid #1E293B;border-radius:18px;padding:16px;cursor:pointer}
.card:active{transform:scale(0.98)}
.small{font-size:11px;color:#64748B;margin-top:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,32,0.98);backdrop-filter:blur(20px);border-top:1px solid #1E293B;display:flex;justify-content:space-around;padding:10px 0 18px}
.nav-item{text-align:center;color:#475569;font-size:10px;flex:1}.nav-item.active{color:#fff}.nav-icon{font-size:22px;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="header"><div class="logo">⚡ ZYNTRA</div><div class="badge" id="lvl">Level 1</div></div>

<div class="balance-card">
<div style="font-size:11px;color:#64748B;letter-spacing:1px">TOTAL BALANCE</div>
<div style="font-size:36px;font-weight:800;margin:8px 0">🟡 <span id="zyn">0</span> ZYN</div>
<div style="font-size:13px;color:#94A3B8">⚡ <span id="energyTxt">500</span>/500 • 🎯 <span id="taps">0</span> Taps</div>
</div>

<div class="tap-wrap">
<div class="tap-btn" onclick="doTap()">⚡</div>
<div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
<div style="margin-top:8px;font-size:12px;color:#64748B" id="rechargeTxt">⚡ 100/hr • 500/500 Full</div>
</div>

<div class="grid">
<div class="card" onclick="openDaily()">🎁<br><b>Daily Bonus</b><div class="small" id="dailyTxt">Claim +50 ZYN</div></div>
<div class="card" onclick="openFarm()">🌱<br><b id="farmTitle">Farming</b><div class="small" id="farmDesc">Start 3H Farm +120</div></div>
<div class="card" onclick="openTasks()">🎯<br><b>Missions</b><div class="small">Earn more ZYN</div></div>
<div class="card" onclick="openFriends()">👥<br><b>Friends</b><div class="small">10% bonus</div></div>
<div class="card" onclick="openSpin()">🎰<br><b>Lucky Spin</b><div class="small" id="spinDesc">3 spins / day</div></div>
<div class="card" onclick="openBoost()">🚀<br><b>Boost</b><div class="small">Multitap + Energy</div></div>
</div>

<div class="bottom-nav">
<div class="nav-item active"><span class="nav-icon">💱</span>Exchange</div>
<div class="nav-item"><span class="nav-icon">⛏️</span>Mine</div>
<div class="nav-item"><span class="nav-icon">👥</span>Friends</div>
<div class="nav-item"><span class="nav-icon">📋</span>Earn</div>
<div class="nav-item"><span class="nav-icon">👛</span>Wallet</div>
</div>

<script>
let tg=Telegram.WebApp; tg.expand();
let maxEnergy=500; // ONLY 500
let zyn=parseInt(localStorage.getItem("zyn_v3")||"188");
let taps=parseInt(localStorage.getItem("taps_v3")||"0");
let energy=parseInt(localStorage.getItem("energy_v3")||"500");
let lastTap=0;

// Anti-cheat reset for 8 lakh user
if(zyn>20000){ zyn=5000; }

function save(){
localStorage.setItem("zyn_v3",zyn);
localStorage.setItem("taps_v3",taps);
localStorage.setItem("energy_v3",energy);
render();
}
function render(){
document.getElementById("zyn").innerText=zyn.toLocaleString();
document.getElementById("taps").innerText=taps;
document.getElementById("energyTxt").innerText=energy;
document.getElementById("energyFill").style.width=(energy/maxEnergy*100)+"%";
document.getElementById("rechargeTxt").innerText=energy>=maxEnergy ? "⚡ 100/hr • 500/500 Full" : "⚡ 100/hr • "+energy+"/500 Recharging...";
let spinsToday=parseInt(localStorage.getItem("spinsToday_v3")||"0");
let lastDay=localStorage.getItem("lastSpinDay_v3")||"";
let today=new Date().toDateString();
if(lastDay!==today) spinsToday=0;
document.getElementById("spinDesc").innerText=(3-spinsToday)+" spins left today";
}
render();

function doTap(){
let now=Date.now();
if(now-lastTap<100) return; // anti autoc
