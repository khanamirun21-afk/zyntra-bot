<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTTC Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:20px}
.card{background:#1c1c1c;padding:20px;border-radius:15px;max-width:400px;margin:auto}
button{background:#ff0040;color:#fff;border:none;padding:12px 20px;border-radius:10px;width:100%;margin-top:10px;font-weight:bold;font-size:16px}
input{width:92%;padding:10px;border-radius:8px;border:none;margin-top:10px;background:#2a2a2a;color:#fff}
.small{font-size:12px;opacity:0.7;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>🔥 BTTC Miner</h2>
<p>Balance: <b id="bal">0</b> BTT</p>
<p>Referral: <b id="ref">0</b></p>
<button id="mineBtn" onclick="mine()">⛏️ Mine 1000 BTT</button>
<input id="wallet" placeholder="T... TRON Address (Trust Wallet / TronLink)" />
<input id="amount" type="number" placeholder="Min 50000 BTT" value="50000" />
<button onclick="withdraw()">💸 Withdraw BTT (TRC20)</button>
<p class="small">Withdraw TRON (TRC20) Network pe hoga. Address T... se start hona chahiye. Fee 0!<br>Invite = 1000 BTT Bonus</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
let balance = parseInt(localStorage.getItem('bttc_bal')||'0');
let refCount = parseInt(localStorage.getItem('bttc_ref')||'0');
document.getElementById('bal').innerText = balance;
document.getElementById('ref').innerText = refCount;

function mine(){
  balance += 1000;
  localStorage.setItem('bttc_bal', balance);
  document.getElementById('bal').innerText = balance;
  tg.HapticFeedback.notificationOccurred('success');
}

function withdraw(){
  let a = document.getElementById('wallet').value.trim();
  let b = parseInt(document.getElementById('amount').value);
  
  if(!a.startsWith('T')){
    alert('Bhai T... wala TRON Address daal! Trust Wallet me TRX > Receive se milega');
    return;
  }
  if(b < 50000){
    alert('Minimum 50000 BTT hai bhai!');
    return;
  }
  if(b > balance){
    alert('Balance kam hai! Pehle Mine kar le');
    return;
  }

  let u = tg.initDataUnsafe?.user;
  let msg = `🚨 BTTC WITHDRAW REQUEST\n\nUser ID: ${u?.id}\nName: ${u?.first_name}\nAmount: ${b} BTT (TRC20)\nWallet: ${a}\n\nTronLink se bhej de bhai!`;
  
  // Telegram pe message bhejega
  tg.sendData(msg);
  
  // Balance kaat de
  balance -= b;
  localStorage.setItem('bttc_bal', balance);
  document.getElementById('bal').innerText = balance;
  
  alert('Withdraw Request bhej diya! 24 ghante me TronLink se BTT aa jayega!');
  document.getElementById('wallet').value = '';
}
</script>
</body>
</html>
