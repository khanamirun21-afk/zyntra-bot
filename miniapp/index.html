*{box-sizing:border-box}

 margin:0;padding:15px;background:#090909;color:white;
 font-family:Arial,sans-serif

.card{
 background:linear-gradient(135deg,#f59e0b,#ef4444);
 border-radius:22px;padding:20px;text-align:center
}
.balance{font-size:36px;font-weight:bold;margin:5px}
.progress{height:10px;background:#333;border-radius:10px;overflow:hidden}

 display:grid;grid-template-columns:1fr 1fr;

}

 border-radius:16px;padding:18px 8px;font-weight:bold;
 font-size:14px
}
.full{grid-column:span 2}

 border-radius:15px;background:#22c55e;color:white;
 font-size:16px;font-weight:bold
}

 width:100%;margin-top:10px;padding:16px;border:0;
 border-radius:15px;background:#ef4444;color:white;
 font-weight:bold
}
.section{
 margin-top:20px;background:#151515;
 padding:16px;border-radius:18px
}

 background:#202020;padding:15px;margin:8px 0;

}

}

</style></head><body><h1>ZYNTRA NETWORK</h1><div class="card">
 <div class="balance" id="balance">0 BTTC</div>
 <p id="ads">0 / 20 Ads Today</p> <div class="progress">
   <div class="fill" id="progress"></div>
 </div> <p id="status">20 Ads complete karo</p>
</div><div class="grid"><button class="btn" onclick="watchAd()">
 📺<br>Watch Ads<br>+500 BTTC
</button><button class="btn" onclick="showTasks()">
 📋<br>Tasks
</button><button class="btn" onclick="invite()">
 👥<br>Invite<br>+1000 BTTC
</button><button class="btn" onclick="openWallet()">
 💰<br>Wallet
</button><button class="btn full" onclick="social()">
 📱 Follow & Earn
</button></div><button class="main" onclick="watchAd()">
▶ WATCH AD +500 BTTC
</button><button class="withdraw" id="withdrawBtn" onclick="openWithdraw()" disabled>
🔒 20 Ads Ke Baad Withdraw
</button><div class="section"><h3>📱 Follow & Earn</h3><div class="task" onclick="follow('Telegram')">
 ✈️ Telegram <span>+1000</span>
</div><div class="task" onclick="follow('Instagram')">
 📸 Instagram <span>+1000</span>
</div><div class="task" onclick="follow('YouTube')">
 ▶️ YouTube <span>+1000</span>
</div></div><!-- WITHDRAW MODAL --><div class="modal" id="withdrawModal"><div class="box"><h2>💸 Withdraw BTTC</h2><p>Available Balance:</p>
<h2 id="withdrawBalance">0 BTTC</h2><input
id="binanceUID"
type="text"
inputmode="numeric"
placeholder="Enter Binance UID"

«»

<p style="font-size:12px;opacity:.7">
Minimum 10,000 BTTC + 20 Ads required.
</p><button class="main" onclick="submitWithdraw()">
✅ Submit Withdrawal
</button><button class="withdraw close" onclick="closeWithdraw()">
Close
</button><p id="withdrawStatus"></p></div>
</div><script>

/* VERCEL BACKEND */
const API_URL = "/api";


let data = JSON.parse(
 localStorage.getItem("zyntra_v3") ||
 '{"bttc":0,"ads":0,"date":"","social":{}}'
);

let today = new Date().toDateString();

if(data.date !== today){
 data.ads = 0;
 data.date = today;
 save();
}

function save(){
 localStorage.setItem("zyntra_v3",JSON.stringify(data));
}

function update(){

 document.getElementById("balance").innerText =
 data.bttc+" BTTC";

 document.getElementById("ads").innerText =
 data.ads+" / 20 Ads Today";

 document.getElementById("progress").style.width =
 Math.min(data.ads/20*100,100)+"%";

 if(data.ads >= 20 && data.bttc >= 10000){

  document.getElementById("withdrawBtn").disabled=false;
  document.getElementById("withdrawBtn").innerText =
  "💸 WITHDRAW BTTC";

  document.getElementById("status").innerText =
  "✅ Withdraw Ready";

 }else{

  document.getElementById("withdrawBtn").disabled=true;

  document.getElementById("withdrawBtn").innerText =
  "🔒 20 Ads + 10,000 BTTC Required";
 }
}

update();


async function watchAd(){

 if(data.ads >= 20){
  alert("Aaj ke 20 Ads complete!");
  return;
 }

 if(typeof show_11817232 !== "function"){
  alert("Ad system load nahi hua.");
  return;
 }

 try{

  await show_11817232();

  data.ads++;
  data.bttc += 500;

  save();
  update();

  alert("+500 BTTC Mila!");

 }catch(e){

  alert("Ad complete nahi hua.");

 }
}


function follow(type){

 if(data.social[type]){
  alert("Already claimed!");
  return;
 }

 data.social[type]=1;
 data.bttc+=1000;

 save();
 update();

 let links={
  Telegram:"https://t.me/ZyntraBotOfficial",
  Instagram:"https://www.instagram.com/zyntra_official_bot",
  YouTube:"https://www.youtube.com/@ZyntraEarn"
 };

 window.open(links[type],"_blank");

 alert("+1000 BTTC");
}


function invite(){

 let user =
 window.Telegram?.WebApp?.initDataUnsafe?.user;

 let id=user?.id || "";

 let link=
 "https://t.me/ZyntraBotOfficial?start="+id;

 prompt("Your Zyntra Invite Link:",link);
}


function showTasks(){

 alert(
 "📋 ZYNTRA TASKS\n\n"+
 "📺 Watch Ads: +500 BTTC\n"+
 "👥 Invite: +1000 BTTC\n"+
 "📱 Social Tasks: +1000 BTTC\n\n"+
 "Minimum Withdraw: 10,000 BTTC"
 );

}


function social(){

 document.querySelector(".section")
 .scrollIntoView({behavior:"smooth"});

}


function openWallet(){

 openWithdraw();

}


function openWithdraw(){

 if(data.ads < 20){
  alert("Pehle 20 Ads complete karo.");
  return;
 }

 if(data.bttc < 10000){
  alert("Minimum 10,000 BTTC required.");
  return;
 }

 document.getElementById("withdrawBalance")
 .innerText=data.bttc+" BTTC";

 document.getElementById("withdrawModal")
 .style.display="block";

}


function closeWithdraw(){

 document.getElementById("withdrawModal")
 .style.display="none";

}


async function submitWithdraw(){

 let uid =
 document.getElementById("binanceUID")
 .value.trim();

 if(!/^[0-9]{5,20}$/.test(uid)){

  alert("Valid Binance UID enter karo.");
  return;

 }

 if(data.ads < 20){
  alert("20 Ads required.");
  return;
 }

 if(data.bttc < 10000){
  alert("Minimum 10,000 BTTC required.");
  return;
 }

 let tgUser =
 window.Telegram?.WebApp?.initDataUnsafe?.user;

 if(!tgUser?.id){

  alert("Telegram user information nahi mili. Zyntra ko Telegram ke andar open karo.");
  return;

 }

 let payload={

  telegram_id:tgUser.id,

  name:
   tgUser.first_name || "User",

  username:
   tgUser.username || "",

  amount:data.bttc,

  ads:data.ads,

  binance_uid:uid

 };

 document.getElementById("withdrawStatus")
 .innerText="⏳ Request sending...";

 try{

  let response = await fetch(
   "/api/withdraw",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify(payload)
   }
  );

  if(!response.ok){

   let errorText = await response.text();

   console.error(
    "Withdrawal API Error:",
    response.status,
    errorText
   );

   throw new Error(
    "API Error "+response.status
   );
  }

  let result = await response.json();

  if(result.success){

   alert(
    "✅ Withdrawal request sent!\n\n"+
    "Admin verification ke baad payment hogi."
   );

   data.bttc=0;
   data.ads=0;

   save();
   update();
   closeWithdraw();

  }else{

   alert(
    result.message ||
    "Withdrawal request failed."
   );

  }

 }catch(e){

  console.error("Withdrawal Error:",e);

  document.getElementById("withdrawStatus")
  .innerText="❌ Server connection error.";

  alert(
   "❌ Server connection error.\n\n"+
   "Please try again."
  );

 }

}

</script></body>
</html>
