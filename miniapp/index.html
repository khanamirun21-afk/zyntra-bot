<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyntra</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#0b1020;color:#fff;min-height:100vh;padding:16px}.app{max-width:500px;margin:auto}.header{text-align:center;padding:14px}.title{font-size:28px;font-weight:bold}.balance{background:linear-gradient(135deg,#172554,#312e81);border-radius:20px;padding:18px;margin:10px 0}.tap{width:180px;height:180px;border-radius:50%;border:none;margin:24px auto;display:block;background:linear-gradient(145deg,#2563eb,#7c3aed);color:#fff;font-size:26px;font-weight:bold;box-shadow:0 15px 35px rgba(37,99,235,.4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#151b2e;border:1px solid #27304a;border-radius:14px;padding:16px;text-align:center}</style></head><body><div class="app"><div class="header"><div style="font-size:40px">⚡</div><div class="title">Zyntra</div><div id="uName" style="color:#9ca3af">Earn • Play • Grow</div></div><div class="balance"><div style="color:#cbd5e1;font-size:13px">YOUR BALANCE</div><div style="font-size:32px;font-weight:bold">🪙 <span id="zyn">0</span> ZYN</div><div style="color:#93c5fd">💎 0 BTTC • Taps: <span id="taps">0</span></div></div><button class="tap" onclick="doTap()">⚡ TAP</button><div class="grid"><div class="card" onclick="daily()"><div>🎁</div><b>Daily Reward</b><div style="font-size:11px;color:#9ca3af">+50 ZYN daily</div></div><div class="card" onclick="farm()"><div>🌱</div><b>Farming</b><div style="font-size:11px;color:#9ca3af" id="farmTxt">Start farming</div></div><div class="card" onclick="mission()"><div>🎯</div><b>Missions</b><div style="font-size:11px;color:#9ca3af">Earn more</div></div><div class="card" onclick="refer()"><div>👥</div><b>Referral</b><div style="font-size:11px;color:#9ca3af">Invite friends</div></div></div></div><script>
let tg=Telegram.WebApp; tg.expand();
let zyn=parseInt(localStorage.getItem("zyn")||"0"); let t=parseInt(localStorage.getItem("taps")||"0");
document.getElementById("zyn").innerText=zyn; document.getElementById("taps").innerText=t;
if(tg.initDataUnsafe.user){document.getElementById("uName").innerText="Hi, "+tg.initDataUnsafe.user.first_name}
function doTap(){zyn++;t++;localStorage.setItem("zyn",zyn);localStorage.setItem("taps",t);document.getElementById("zyn").innerText=zyn;document.getElementById("taps").innerText=t;tg.HapticFeedback&&tg.HapticFeedback.impactOccurred("light")}
function daily(){let last=localStorage.getItem("daily");let now=Date.now();if(!last||now-last>86400000){zyn+=50;localStorage.setItem("zyn",zyn);localStorage.setItem("daily",now);document.getElementById("zyn").innerText=zyn;tg.showAlert("🎉 50 ZYN Claimed!")}else{tg.showAlert("Kal aana! 24h baad milega")}}
function farm(){let f=localStorage.getItem("farmStart");if(!f){localStorage.setItem("farmStart",Date.now());document.getElementById("farmTxt").innerText="Farming... 3h";tg.showAlert("🌱 Farming Started! 3 ghante baad 100 ZYN milega");}else{let diff=Date.now()-parseInt(f);if(diff>10800000){zyn+=100;localStorage.setItem("zyn",zyn);localStorage.removeItem("farmStart");document.getElementById("zyn").innerText=zyn;document.getElementById("farmTxt").innerText="Start farming";tg.showAlert("🌾 100 ZYN Harvested!")}else{tg.showAlert("Abhi time baki hai! "+Math.floor((10800000-diff)/60000)+" min")}}}
function mission(){tg.showAlert("🎯 Missions:\n1. Join Channel +20 ZYN\n2. Follow X +20 ZYN\n\nZYN = "+zyn);}
function refer(){let uid=tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:"user";let link="https://t.me/"+(tg.initDataUnsafe.user?tg.initDataUnsafe.bot_username||"your_bot":"your_bot")+"?start="+uid;tg.showAlert("👥 Tera Referral Link:\n"+link+"\n\nHar friend pe 100 ZYN!");}
</script></body></html>
